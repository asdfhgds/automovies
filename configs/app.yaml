default_project_dir: data
schemas_dir: configs/schemas
models:
  director_model: "local/text-model"
  tts: "local/tts"
  image_model: "comfyui"
novelty_memory_size: 20
transcription:
  provider: whisperx
  model: small
  device: auto
  compute_type: auto
  language: auto
  align: true
  diarization: false

director:
  enabled: true
  provider: qwen
  model: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  thinking: false
  temperature: 0.8
  top_p: 0.9
  max_new_tokens: 2048
  timeout_sec: 180

script:
  provider: qwen
  model: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  thinking: false
  temperature: 0.7
  max_new_tokens: 1024

vision:
  enricher: heuristic           # heuristic | qwen3vl
  model: Qwen/Qwen2.5-VL-7B-Instruct
  device: auto
  max_frames: 1

tts:
  provider: kokoro
  model: hexgrad/Kokoro-82M
  voice: am_adam
  language: en
  device: auto
  sample_rate: 24000
  # Director-controlled narration delivery defaults (overridable via
  # TTS_TONE / TTS_EMOTION / TTS_PACE / TTS_ENERGY / TTS_INTENSITY):
  narration:
    tone: analytical
    emotion: neutral
    pace: 1.0
    energy: 0.5
    dramatic_intensity: 0.5

editing:
  export_width: 1280
  export_height: 720
  fps: 30
  audio_sample_rate: 44100
  burn_subtitles: true
  film_ducking: true
  music_ducking: true
  loudness_target_lufs: -16
  true_peak_limit: 0.95
