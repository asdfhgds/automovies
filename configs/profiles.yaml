# Autonomous Movie Studio Configuration Profiles
# 
# Use profiles to switch between local development (laptop) and GPU-accelerated execution (Colab).
# Profile selection:
#   - Command line: python src/main.py run --profile local
#   - Environment: export STUDIO_PROFILE=colab-gpu
#   - Default: local

profiles:
  local:
    description: "Weak laptop development profile - all mocks, local FFmpeg only"
    providers:
      llm: mock
      transcription: mock
      script: mock
      tts: mock
      image: mock
      video: mock
    editing:
      extractor: ffmpeg
    
  colab-gpu:
    description: "Google Colab GPU profile - real models where available"
    providers:
      llm: qwen
      transcription: whisperx
      script: qwen
      tts: kokoro
      image: mock
      video: mock
    editing:
      extractor: ffmpeg

# Provider-specific configuration
# Each provider can be overridden via environment variables (e.g., DIRECTOR_MODEL=Qwen/Qwen3-4B-Instruct-2507)

providers:
  llm:
    mock:
      type: mock
      enabled: true
    qwen:
      model: Qwen/Qwen3-4B-Instruct-2507
      device: auto
      dtype: auto
      thinking: false
      temperature: 0.8
      top_p: 0.9
      max_new_tokens: 2048
      timeout_sec: 180
  
  transcription:
    mock:
      type: mock
      enabled: true
    whisperx:
      model: small
      device: auto
      compute_type: auto
      language: auto
      align: true
      diarization: false
  
  script:
    mock:
      type: mock
      enabled: true
    qwen:
      type: qwen
      enabled: true
      model: Qwen/Qwen3-4B-Instruct-2507
      device: auto
      dtype: auto
      thinking: false
      temperature: 0.7
      max_new_tokens: 1024
  
  tts:
    mock:
      type: mock
      enabled: true
    kokoro:
      type: kokoro
      model: "hexgrad/Kokoro-82M"
      voice: "am_adam"
      language: "en"
      device: auto
      emotion: "neutral"
      speaking_rate: 1.0
    chatterbox:
      type: chatterbox
      model: "resembleai/chatterbox"
      voice_path: null
      language: "en"
      device: auto
      dtype: auto
    qwen3_tts:
      type: qwen3_tts
      model: "Qwen/Qwen3-TTS"
      voice: "Chelsie"
      language: "en"
      device: auto
      dtype: auto
  
  image:
    mock:
      type: mock
      enabled: true
    comfyui:
      endpoint: "http://localhost:8188"
      model: "sd3-medium"
  
  video:
    mock:
      type: mock
      enabled: true

# Pipeline configuration
pipeline:
  stages:
    - transcription
    - scene_detection
    - scene_indexing
    - research
    - director
    - scene_ranking
    - scene_selection
    - script_generation
    - tts
    - visual_planning
    - image_generation
    - video_generation
    - editing
    - audio_mixing
    - rendering
    - quality_control

# Project data structure
project:
  data_dir: data
  structure:
    input: "input"
    research: "research"
    transcripts: "transcripts"
    scenes: "scenes"
    director: "director"
    script: "script"
    assets:
      - movie_clips
      - images
      - video
      - audio
      - music
    timeline: "timeline"
    renders: "renders"
    reports: "reports"
    memory: "memory"

# Logging and debugging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Hardware detection (for `doctor` command)
hardware:
  check_cuda: true
  check_ffmpeg: true
  check_dependencies: true
